spring:
  profiles:
    default: broken
  output:
    ansi:
      enabled: ALWAYS
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: http://localhost:8081
        auto.register.schemas: false
        use.latest.version: true
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        schema.registry.url: http://localhost:8081
        specific.avro.reader: true

guild:
  # How many AdventurerRegistered events the scenario floods before the hero's
  # lifecycle — the backlog that lets the level-up overtake in the broken act.
  flood-size: 500
  # Simulated per-message work (enrichment/DB write) in the registration listener.
  registration-latency-ms: 5
